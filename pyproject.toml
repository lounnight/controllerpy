[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "micropy"
version = "0.1.0"
description = "Write Arduino programs in a Python-like subset and transpile them to C++"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "micropy contributors" }]
keywords = ["arduino", "transpiler", "compiler", "python", "embedded", "arduino-cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
micropy = "micropy.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
micropy = ["runtime/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
